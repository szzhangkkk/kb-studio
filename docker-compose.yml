services:
  kb-studio:
    build:
      context: .
      target: slim            # Change to "full" for local embedding + Claude support
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data              # Knowledge base data (documents, chunks, conversations)
      - ./config:/app/config          # LLM/embedding configuration (active.yaml)
    environment:
      - KB_STUDIO_API_KEY=${KB_STUDIO_API_KEY:-}          # Optional: set to enable API key auth
      - KB_STUDIO_CORS_ORIGINS=${KB_STUDIO_CORS_ORIGINS:-*}  # Optional: restrict CORS origins
    restart: unless-stopped

