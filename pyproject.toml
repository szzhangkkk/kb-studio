[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb_studio"]

[project]
name = "kb-studio"
version = "0.1.0"
description = "Self-deployable knowledge base Q&A platform"
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]>=0.1.0",
    "openai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "click>=8.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
claude = ["anthropic>=0.30.0"]
local-embed = ["sentence-transformers>=2.0.0"]
mcp = ["mcp>=1.0.0"]
all = ["kb-studio[claude,local-embed,mcp]"]
dev = ["pytest>=8.0.0"]

[project.scripts]
kb-studio = "kb_studio.cli:main"
